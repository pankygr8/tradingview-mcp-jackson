# Gann Square Blueprint EOD screener (dashboard/gann_square_agent).
# Scans every NSE equity after the close with the Pine indicator's logic,
# using end-of-day prices from NSE's official MCP server (mcp.nseindia.in),
# publishes https://<user>.github.io/<repo>/gannsquare/ and sends Telegram alerts.
#
# Two jobs, so the long first download never blocks the other agents:
#   fetch    NSE prices → `nse-eod-data` branch (raw bhavcopy store, NOT published)
#   publish  scan + page + alerts → gannsquare/ on the shared `agent-data` branch
#
# FIRST RUN: Actions → gann-square-agent → Run workflow → command "bootstrap".
# The history download (≈ 20 calls per stock for 5 years) continues on every run
# until all stocks are complete; the page shows the progress.
#
# NSE updates the MCP bhavcopy once after the close, so the runs are at 19:30 and
# 22:00 IST (the second catches a late update; alerts are never sent twice).
# GitHub's scheduler can be late or skip runs — add a cron-job.org job that POSTs to
# .../actions/workflows/gann-square-agent.yml/dispatches with {"ref":"main"} at those times.
name: gann-square-agent

on:
  schedule:
    - cron: "0 14 * * 1-5"      # 19:30 IST
    - cron: "30 16 * * 1-5"     # 22:00 IST
  workflow_dispatch:
    inputs:
      command:
        description: "eod | bootstrap | probe | report | test-alert"
        default: "eod"
        required: true

permissions:
  contents: write

env:
  TZ: Asia/Kolkata
  STORE_BRANCH: nse-eod-data
  DATA_BRANCH: agent-data
  AGENT: dashboard/gann_square_agent

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: nse-eod-data
      cancel-in-progress: false
    env:
      CMD: ${{ github.event.inputs.command || 'eod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/scanner_agent/requirements.txt
      - name: Install dependencies
        run: pip install -r dashboard/scanner_agent/requirements.txt

      - name: Restore the NSE price store
        run: |
          mkdir -p "$AGENT/store"
          if git fetch --depth 1 origin "$STORE_BRANCH" 2>/dev/null; then
            git archive "origin/$STORE_BRANCH" | tar -x -C "$AGENT/store"
            echo "restored $(ls $AGENT/store/hist | wc -l) stocks"
          else
            echo "no $STORE_BRANCH branch yet - first download"
          fi

      - name: Fetch prices from NSE's MCP server
        if: env.CMD == 'eod' || env.CMD == 'bootstrap' || env.CMD == 'probe'
        working-directory: dashboard
        run: |
          case "$CMD" in
            bootstrap) python -m gann_square_agent fetch --budget 320 ;;
            probe)     python -m gann_square_agent probe; cat gann_square_agent/state/probe.json | head -c 6000 ;;
            *)         python -m gann_square_agent fetch ;;
          esac

      - name: Save the price store
        if: always() && (env.CMD == 'eod' || env.CMD == 'bootstrap')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f "$AGENT/store/meta.json" ] || { echo "nothing to save"; exit 0; }
          out=$(mktemp -d)
          cp -r "$AGENT/store/." "$out/"
          cd "$out"
          git init -q -b "$STORE_BRANCH"
          git add -A
          git -c user.name="gann-square-agent" -c user.email="actions@users.noreply.github.com" \
              commit -qm "NSE EOD store $(date '+%Y-%m-%d %H:%M IST') run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$STORE_BRANCH"
          echo "saved $(ls hist | wc -l) stocks to $STORE_BRANCH"

  publish:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-data          # shared with crypto-agent.yml and scanner-agent.yml
      cancel-in-progress: false
    env:
      CMD: ${{ github.event.inputs.command || 'eod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/scanner_agent/requirements.txt
      - name: Install dependencies
        run: pip install -r dashboard/scanner_agent/requirements.txt

      - name: Restore price store and screener state
        run: |
          mkdir -p "$AGENT/store" "$AGENT/state"
          if git fetch --depth 1 origin "$STORE_BRANCH" 2>/dev/null; then
            git archive "origin/$STORE_BRANCH" | tar -x -C "$AGENT/store"
          fi
          if git fetch --depth 1 origin "$DATA_BRANCH" 2>/dev/null && \
             git ls-tree -d "origin/$DATA_BRANCH" gannsquare | grep -q gannsquare; then
            tmp=$(mktemp -d)
            git archive "origin/$DATA_BRANCH" gannsquare | tar -x -C "$tmp"
            cp -r "$tmp/gannsquare/." "$AGENT/state/"
          fi

      - name: Scan, page, alerts
        working-directory: dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GANN_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/gannsquare/
        run: |
          case "$CMD" in
            test-alert)       python -m gann_square_agent test-alert ;;
            report|probe)     python -m gann_square_agent report ;;
            *)                python -m gann_square_agent publish ;;
          esac

      - name: Save to the data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f "$AGENT/state/index.html" ] || { echo "no page built"; exit 0; }
          out=$(mktemp -d)
          git fetch --depth 1 origin "$DATA_BRANCH" 2>/dev/null || true
          if git rev-parse -q --verify "origin/$DATA_BRANCH" >/dev/null; then
            git archive "origin/$DATA_BRANCH" | tar -x -C "$out"
          fi
          rm -rf "$out/gannsquare"; mkdir -p "$out/gannsquare"
          cp -r "$AGENT/state/." "$out/gannsquare/"
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b "$DATA_BRANCH"
          git add -A
          git -c user.name="gann-square-agent" -c user.email="actions@users.noreply.github.com" \
              commit -qm "gann square run ${{ github.run_number }} $(date '+%Y-%m-%d %H:%M IST')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"
          echo "saved gannsquare/ to $DATA_BRANCH"
