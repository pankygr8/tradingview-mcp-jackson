# BTC / ETH swing paper trading (dashboard/crypto_agent) and the Nifty 200
# intraday + swing screener (dashboard/nifty_agent).
# Runs every 15 minutes, 24/7. Signals and paper trades only — never sends orders.
#
# State lives in the crypto/ and nifty200/ folders of the shared `agent-data`
# branch, published at https://<user>.github.io/<repo>/crypto/ and /nifty200/
# (the Nifty agent does nothing outside market hours except after 16:00 IST).
#
# GitHub's own scheduler is unreliable for this repo, so also add a second
# cron-job.org job that POSTs to .../actions/workflows/crypto-agent.yml/dispatches
# with body {"ref":"main"} every 15 minutes, every day.
name: crypto-agent

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "live | swing --months 36 | report | test-alert"
        default: "live"
        required: true
      nifty_command:
        description: "Nifty 200 screener: live | backtest | report | test-alert"
        default: "live"
        required: true

permissions:
  contents: write

concurrency:
  group: agent-data          # shared with scanner-agent.yml — both write the same data branch
  cancel-in-progress: false

env:
  TZ: Asia/Kolkata
  DATA_BRANCH: agent-data
  STATE: dashboard/crypto_agent/state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/scanner_agent/requirements.txt

      - name: Install dependencies
        run: pip install -r dashboard/scanner_agent/requirements.txt

      - name: Restore crypto state from the data branch
        run: |
          mkdir -p "$STATE"
          if git fetch --depth 1 origin "$DATA_BRANCH" 2>/dev/null && \
             git ls-tree -d "origin/$DATA_BRANCH" crypto | grep -q crypto; then
            tmp=$(mktemp -d)
            git archive "origin/$DATA_BRANCH" crypto | tar -x -C "$tmp"
            cp -r "$tmp/crypto/." "$STATE/"
            rm -f "$STATE/index.html"
            echo "restored crypto state"
          else
            echo "no crypto state yet - run once with command 'backtest'"
          fi

      - name: Restore Nifty 200 state from the data branch
        run: |
          mkdir -p dashboard/nifty_agent/state
          if git rev-parse -q --verify "origin/$DATA_BRANCH" >/dev/null && \
             git ls-tree -d "origin/$DATA_BRANCH" nifty200 | grep -q nifty200; then
            tmp=$(mktemp -d)
            git archive "origin/$DATA_BRANCH" nifty200 | tar -x -C "$tmp"
            cp -r "$tmp/nifty200/." dashboard/nifty_agent/state/
            rm -f dashboard/nifty_agent/state/index.html
          fi

      - name: Run crypto agent
        working-directory: dashboard
        env:
          CMD: ${{ github.event.inputs.command || 'live' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTO_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/crypto/
        run: python -m crypto_agent $CMD

      - name: Run Nifty 200 screener
        continue-on-error: true
        working-directory: dashboard
        env:
          CMD: ${{ github.event.inputs.nifty_command || 'live' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NIFTY_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nifty200/
        run: python -m nifty_agent $CMD

      - name: Save crypto state to the data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(mktemp -d)
          git fetch --depth 1 origin "$DATA_BRANCH" 2>/dev/null || true
          if git rev-parse -q --verify "origin/$DATA_BRANCH" >/dev/null; then
            git archive "origin/$DATA_BRANCH" | tar -x -C "$out"
          fi
          rm -rf "$out/crypto"
          mkdir -p "$out/crypto"
          cp -r "$STATE/." "$out/crypto/"
          [ -f "$STATE/reports/crypto.html" ] && cp "$STATE/reports/crypto.html" "$out/crypto/index.html"
          rm -rf "$out/commodity"          # commodities removed 22 Oct 2026
          if [ -d dashboard/nifty_agent/state ]; then
            rm -rf "$out/nifty200"; mkdir -p "$out/nifty200"
            cp -r dashboard/nifty_agent/state/. "$out/nifty200/"
            [ -f "$out/nifty200/reports/nifty200.html" ] && cp "$out/nifty200/reports/nifty200.html" "$out/nifty200/index.html"
          fi
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b "$DATA_BRANCH"
          git add -A
          git -c user.name="crypto-agent" -c user.email="actions@users.noreply.github.com" \
              commit -qm "crypto run ${{ github.run_number }} $(date '+%Y-%m-%d %H:%M IST')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$DATA_BRANCH"
          echo "saved crypto/ and nifty200/ to $DATA_BRANCH"
