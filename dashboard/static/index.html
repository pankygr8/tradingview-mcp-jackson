<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">

    <!-- ── Top bar ──────────────────────────────────────────────────────── -->
    <header class="topbar">

      <!-- Brand -->
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
             aria-hidden="true">
          <rect width="20" height="20" rx="4" fill="#2f81f7" opacity=".15"/>
          <polyline points="2,15 7,9 11,12 18,5" stroke="#2f81f7"
                    stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" fill="none"/>
        </svg>
        Trading Dashboard
      </div>

      <div class="divider"></div>

      <!-- Chart-count selector -->
      <div class="ctrl-group">
        <span class="ctrl-label">Charts</span>
        <div class="count-buttons" role="group" aria-label="Number of charts">
          <button class="count-btn" data-count="1"  aria-label="1 chart" >1</button>
          <button class="count-btn" data-count="2"  aria-label="2 charts">2</button>
          <button class="count-btn" data-count="4"  aria-label="4 charts">4</button>
          <button class="count-btn" data-count="6"  aria-label="6 charts">6</button>
          <button class="count-btn" data-count="8"  aria-label="8 charts">8</button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Layout legend (informational) -->
      <div class="ctrl-group">
        <span class="ctrl-label" id="layoutLabel">2 × 2</span>
      </div>

      <!-- Signals link -->
      <a class="nav-link" href="/signals" title="Swing Fib Signals" style="margin-left:auto">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Signals
      </a>

      <!-- Screener link -->
      <a class="nav-link" href="/screener" title="NSE ATH Screener" style="margin-left:0">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <polyline points="2,15 7,9 11,12 18,5" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" fill="none"/>
        </svg>
        Screener
      </a>

      <!-- Connection status (Hyperliquid WebSocket) -->
      <div class="status" aria-live="polite">
        <div class="status-dot" aria-hidden="true"></div>
        <span class="status-text">Connecting…</span>
      </div>

    </header>

    <!-- ── Chart grid (panes injected here by main.js) ─────────────────── -->
    <main class="grid-container grid-4" id="gridContainer" aria-label="Chart grid">
    </main>

  </div><!-- .app -->

  <!-- ── Vendor scripts (global, loaded before ES-modules) ──────────────── -->
  <!--
    Lightweight Charts v5 — MIT licence
    https://tradingview.github.io/lightweight-charts/
  -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <!-- ── App entry point ────────────────────────────────────────────────── -->
  <script type="module" src="js/main.js"></script>

  <!-- ── Layout label updater (plain script, non-critical) ─────────────── -->
  <script>
    const LABELS = { 1: '1 × 1', 2: '2 × 1', 4: '2 × 2', 6: '3 × 2', 8: '4 × 2' };
    document.addEventListener('DOMContentLoaded', () => {
      const lbl  = document.getElementById('layoutLabel');
      const btns = document.querySelectorAll('.count-btn');

      function refresh() {
        const active = document.querySelector('.count-btn.active');
        if (active && lbl) lbl.textContent = LABELS[active.dataset.count] ?? '';
      }

      btns.forEach(b => b.addEventListener('click', () =>
        requestAnimationFrame(refresh)
      ));

      // main.js (ES module) sets the active class after DOMContentLoaded.
      // Use a small delay so the module always wins the race.
      setTimeout(refresh, 80);
    });
  </script>

</body>
</html>
